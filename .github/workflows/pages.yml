name: Publish frontend (manual)
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:source && npm test && npm run build
      - name: Record exact release provenance
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest = JSON.parse(readFileSync('deployment.json', 'utf8'));
          const html = readFileSync('dist/index.html', 'utf8');
          const files = [...html.matchAll(/<script[^>]+src="([^"]+\.js)"/g)].map(m => m[1].replace(/^\.\//, ''));
          if (!files.length || files.some(file => !file.startsWith('assets/') || file.includes('..'))) throw new Error('Unexpected production bundle paths');
          const bundles = files.map(file => {
            const bytes = readFileSync('dist/' + file);
            return {file, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex')};
          });
          const release = {
            applicationCommit: process.env.GITHUB_SHA,
            pagesRunId: Number(process.env.GITHUB_RUN_ID),
            pagesRun: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            builtAt: new Date().toISOString(),
            contractAddress: manifest.contractAddress, chainId: manifest.chainId, rpc: manifest.rpc,
            sourceSha256: manifest.sourceSha256, sourceVerificationStatus: manifest.sourceVerificationStatus,
            monitorOwner: manifest.monitorOwner, monitorId: manifest.monitorId, bundles,
            evidenceScope: 'Build provenance published with this artifact; read-only browser acceptance is recorded separately. Historical RPC/Explorer access restrictions are not declared universally resolved.'
          };
          writeFileSync('dist/release.json', JSON.stringify(release, null, 2) + '\n');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
